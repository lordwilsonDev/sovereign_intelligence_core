name: Sovereign CI/CD Mesh
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  sovereign-gate:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: make test
      - run: bash scripts/merkle_verify_dependencies.sh . msb_v2/pipeline/trusted_supply_chain.json
      - run: bash scripts/canary_sovereignty_probe.sh http://localhost:8000 /metrics /sac/self-audit 1
