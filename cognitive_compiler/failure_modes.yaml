failure_modes:
  - id: "endless-inversion-loop"
    description: "MoIE debate does not converge; Critic keeps inverting without resolution."
    detection: "Logic loop exceeds max_iterations (default 5) or identical inversions recur."
    recovery: "Force synthesis with Synthesizer override, reduce iteration limit, flag for human."
  - id: "confident-hallucination-with-falsification"
    description: "System generates falsifiable predictions that are wrong but phrased confidently."
    detection: "High FTS and low prediction validation rate post-hoc."
    recovery: "Increase empirical connection attempts; lower confidence calibration; run drift check."
  - id: "assumption-debt-overload"
    description: "Too many untested high-risk assumptions accumulated."
    detection: "Assumption debt exceeds critical threshold (e.g., 5)."
    recovery: "Pause generation, run empirical checks, escalate to human."
  - id: "shared-cognitive-state-corruption"
    description: "SCS contains contradictory assumptions due to hybrid harness transitions."
    detection: "State coherence audit finds conflicting assumption IDs."
    recovery: "Roll back SCS to last known consistent checkpoint; re-run assumptions reconciliation."
